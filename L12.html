  .slots{display:flex;gap:12px;justify-content:center;margin:10px 0 24px}
  .slot{width:78px;height:78px;border:3px dashed var(--pri2);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:bold;background:#fffaf2;cursor:pointer}
  .slot.ok{border:3px solid var(--ok);background:#e6f7ec}
  .slot.bad{border:3px solid var(--bad);background:#fdecec}
  .tiles{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .tile{width:78px;height:78px;font-size:42px;font-weight:bold;font-family:inherit;border-radius:14px;border:3px solid var(--line);background:#fff;cursor:pointer;color:var(--ink);box-shadow:0 3px 0 var(--line)}

  .center{text-align:center}
  /* 結果 */

  .result h2{font-size:32px;margin:10px 0}
  .result p{font-size:20px;color:var(--sub)}
  .rbtns{display:flex;gap:14px;justify-content:center;margin-top:20px;flex-wrap:wrap}
  .rbtns button{font-family:inherit;font-size:20px;padding:10px 26px;border-radius:26px;border:0;cursor:pointer;font-weight:bold}
  .rbtns .a{background:var(--pri);color:#fff} .rbtns .b{background:#fff;border:2px solid var(--line);color:var(--ink)}
  .review{text-align:left;max-width:640px;margin:20px auto 0;background:#fff;border-radius:16px;padding:14px 20px;border:2px solid var(--line);font-size:17px;line-height:1.7}
  .confetti{position:fixed;top:-20px;font-size:26px;pointer-events:none;animation:fall linear forwards;z-index:99}

</style>
</head>

function beep(ok){
  if(!soundOn) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const notes = ok ? [660,880] : [300,220];
    notes.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();

      o.connect(g); g.connect(actx.destination); o.start(actx.currentTime+i*.12); o.stop(actx.currentTime+i*.12+.22);
    });
  }catch(e){}
}

    <div class="menu">${MODES.map(m=>`
      <button class="mbtn ${m.big?"big":""}" onclick="start('${m.id}')">
        ${m.id!=="learn"&&best[m.id]!=null?`<span class="best">${starStr(best[m.id])}</span>`:""}
        <div class="ic">${m.ic}</div><h3>${m.t}</h3><p>${m.d}</p>
      </button>`).join("")}
    </div>`;
  window.scrollTo(0,0);
}

/* ===================== 題目產生 ===================== */
function distract(ans,n=3){ return pick(W.filter(w=>w!==ans),n); }
function genMeaning(){ return shuffle(IDIOMS).map(x=>({type:"看解釋猜成語", html:`「${esc(x.m)}」<br>這是哪一個成語？`, a:x.w, o:shuffle([x.w,...distract(x.w)]), exp:`${x.w}：${x.m}`})); }
function genReverse(){ return shuffle(IDIOMS).map(x=>{
  const others = pick(IDIOMS.filter(y=>y.w!==x.w),3).map(y=>y.m);
  return {type:"看成語選解釋", html:`「<span class="hl">${x.w}</span>」是什麼意思？`, a:x.m, o:shuffle([x.m,...others]), small:true, exp:`${x.w}：${x.m}`};
}); }
function genFill(n=6){ return pick(FILL,n).map(f=>({type:"例句填空・"+f.src, html:esc(f.s).replace(f.a,'<span class="blank">？</span>'), a:f.a, o:shuffle([f.a,...distract(f.a)]), exp:f.s})); }
function genChar(n=6){ return pick(CHARQ,n).map(c=>{
  const chars=[...c.w]; const ans=chars[c.i]; chars[c.i]='<span class="blank" style="min-width:60px">？</span>';
  return {type:"生字找找看", html:`選出正確的字：<br><span style="font-size:42px;letter-spacing:6px">${chars.join("")}</span><br><span style="font-size:18px;color:var(--sub)">提示：${byW(c.w).m}</span>`, a:ans, o:shuffle(c.opts), exp:`正確寫法是「${c.w}」。`};
}); }
function genSyn(){ return shuffle(SYN).map(s=>({type:"近義反義大考驗", html:`「<span class="hl">${s.q}</span>」的<span style="color:${s.t==="近"?"var(--blue)":"var(--bad)"}">${s.t}義詞</span>是哪一個？`, a:s.a, o:shuffle(s.o), exp:[s.q, byW(s.q).near&&("近義："+byW(s.q).near), byW(s.q).anti&&("反義："+byW(s.q).anti)].filter(Boolean).join("　")})); }
function genTF(n=8){ return pick(TF,n).map(t=>({type:"用對了嗎？", html:`${esc(t.s)}<br><span style="font-size:20px;color:var(--sub)">這句話的成語用得對嗎？</span>`, a:t.a?"⭕ 用對了":"❌ 用錯了", o:["⭕ 用對了","❌ 用錯了"], exp:t.why})); }
function genOrder(){ return shuffle(IDIOMS).map(x=>({kind:"order", type:"成語排排看", w:x.w, m:x.m})); }

/* ===================== 一般測驗引擎 ===================== */
let G=null;
function start(mode){
  if(mode==="learn") return learn();
  if(mode==="match") return matchGame();
  const titles=Object.fromEntries(MODES.map(m=>[m.id,m.ic+" "+m.t]));
  let qs;
  switch(mode){
    case "meaning": qs=genMeaning(); break;
    case "reverse": qs=genReverse(); break;
    case "fill": qs=genFill(); break;
    case "char": qs=genChar(); break;
    case "syn": qs=genSyn(); break;
    case "tf": qs=genTF(); break;
    case "order": qs=genOrder(); break;
    case "mix": qs=shuffle([...pick(genMeaning(),2),...pick(genReverse(),1),...pick(genFill(),2),...pick(genChar(),2),...pick(genSyn(),2),...pick(genTF(),2),...pick(genOrder(),1)]); break;
  }
  G={mode, title:titles[mode], qs, i:0, score:0, wrong:[]};
  renderQ();
}
function header(){
  return `<div class="bar"><button class="back" onclick="goMenu()">← 回選單</button><h2>${G.title}</h2><span class="sp"></span>
    <span class="pill">第 ${G.i+1} / ${G.qs.length} 題</span><span class="pill">得分 ${G.score}</span></div>
    <div class="prog"><i style="width:${G.i/G.qs.length*100}%"></i></div>`;
}
function renderQ(){
  if(G.i>=G.qs.length) return finish();
  const q=G.qs[G.i];
  if(q.kind==="order") return renderOrder(q);
  $app.innerHTML = header()+`<div class="qcard">
    <span class="qtype">${q.type}</span>
    <div class="qtext">${q.html}</div>
    <div class="opts" ${q.o.length===2?'':''}>${q.o.map((o,k)=>`<button class="opt" data-k="${k}" style="${q.small?"font-size:19px;line-height:1.5;text-align:left;padding:14px 16px":""}">${esc(o)}</button>`).join("")}</div>
    <div id="fb"></div></div>`;
  $app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b,q));
}
function answer(btn,q){
  const pickVal=q.o[+btn.dataset.k], ok = pickVal===q.a;
  $app.querySelectorAll(".opt").forEach(b=>{ b.disabled=true; if(q.o[+b.dataset.k]===q.a) b.classList.add("ok"); });
  if(!ok) btn.classList.add("bad");
  beep(ok);
  if(ok) G.score++; else G.wrong.push(q.exp);
  // 填空題答完把句子補完整
  const qt=$app.querySelector(".qtext .blank"); if(qt){ qt.textContent=q.a; qt.style.color=ok?"var(--ok)":"var(--bad)"; }
  document.getElementById("fb").innerHTML = `<div class="fb ${ok?"ok":"bad"}">${ok?"🎉 答對了！":"😅 再想想，正確答案是「"+esc(q.a)+"」"}<br>📌 ${esc(q.exp)}</div>
    <button class="next" onclick="G.i++;renderQ()">${G.i+1<G.qs.length?"下一題 →":"看結果 🏁"}</button><div class="clear"></div>`;
}

/* 排排看 */
function renderOrder(q){
  const target=[...q.w];
  const decoyPool=[...new Set(CHARQ.flatMap(c=>c.opts).filter(c=>!target.includes(c)))];
  const tiles=shuffle([...target,...pick(decoyPool,2)]);
  const st={filled:[], tiles, mistakes:0};
  const draw=()=>{
    $app.innerHTML = header()+`<div class="qcard center">
      <span class="qtype">成語排排看</span>
      <div class="qtext" style="font-size:24px">提示：「${esc(q.m)}」</div>
      <div class="slots">${target.map((c,k)=>`<div class="slot ${st.filled[k]!=null?"ok":""}">${st.filled[k]!=null?tiles[st.filled[k]]:""}</div>`).join("")}</div>
      <div class="tiles">${tiles.map((c,k)=>`<button class="tile" data-k="${k}" ${st.filled.includes(k)||st.done?"disabled":""}>${c}</button>`).join("")}</div>
      <div id="fb"></div></div>`;
    $app.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k, need=target[st.filled.length];
      if(tiles[k]===need){ st.filled.push(k); if(st.filled.length===4){ st.done=true; } draw(); if(st.done) doneOrder(); }
      else { st.mistakes++; beep(false); b.classList.add("wrong"); b.style.borderColor="var(--bad)"; setTimeout(()=>{b.style.borderColor="";},400);
        if(st.mistakes>=3){ st.done=true; st.filled=target.map(c=>tiles.indexOf(c)); draw(); doneOrder(); } }
    });
  };
  const doneOrder=()=>{
    const ok=st.mistakes<3;
    if(ok) G.score++; else G.wrong.push(`${q.w}：${q.m}`);
    beep(ok); if(soundOn) speak(q.w);
    document.getElementById("fb").innerHTML=`<div class="fb ${ok?"ok":"bad"}">${ok?(st.mistakes===0?"🎉 完美！一次就排對！":"👍 排好了！"):"😅 錯了三次，答案是「"+q.w+"」，再多看幾次喔！"}<br>📌 ${q.w}：${esc(q.m)}</div>
      <button class="next" onclick="G.i++;renderQ()">${G.i+1<G.qs.length?"下一題 →":"看結果 🏁"}</button><div class="clear"></div>`;
  };
  draw();
}

function finish(){
  const n=G.qs.length, s=G.score, r=s/n;
  const stars = r===1?3: r>=.7?2: r>=.4?1:0;
  saveBest(G.mode,stars);
  if(stars>=2) confetti();
  const msg = ["再練習一次，你一定可以的！💪","不錯喔，繼續加油！","很棒！差一點就滿分了！","太厲害了！你是成語小達人！🏅"][stars];
  $app.innerHTML=`<div class="qcard result">
    <div class="stars">${starStr(stars)}</div>
    <h2>${msg}</h2><p>答對 ${s} / ${n} 題</p>
    ${G.wrong.length?`<div class="review"><b>📝 再複習一下：</b><br>${G.wrong.map(w=>"・"+esc(w)).join("<br>")}</div>`:""}
    <div class="rbtns"><button class="a" onclick="start('${G.mode}')">🔁 再玩一次</button><button class="b" onclick="goMenu()">🏠 回選單</button></div></div>`;
  window.scrollTo(0,0);
}

/* ===================== 學習卡 ===================== */
function learn(){
  $app.innerHTML=`<div class="bar"><button class="back" onclick="goMenu()">← 回選單</button><h2>📖 成語小卡</h2><span class="sp"></span><span class="pill">點卡片翻面</span></div>
  <div class="cards">${IDIOMS.map((x,k)=>`
    <div class="fcard" onclick="this.classList.toggle('flip')"><div class="fin">
      <div class="face front"><div class="idiom">${x.w}</div><div class="zy">${x.zy}</div>
        <button class="say" onclick="event.stopPropagation();speak('${x.w}')">🔈 聽發音</button></div>
      <div class="face back">
        <div><b>解釋：</b>${x.m}</div>
        ${x.near?`<div style="margin-top:6px"><span class="tagn n">近</span>${x.near}　<span class="tagn f">反</span>${x.anti}</div>`:""}
        <div style="margin-top:6px"><b>例句：</b>${x.ex.replace(x.w,`<u>${x.w}</u>`)}</div>
        <button class="say" onclick="event.stopPropagation();speak('${x.w}。${x.m}${x.ex}')">🔈 念給我聽</button>
      </div></div></div>`).join("")}
  </div>`;
}

/* ===================== 配對連連看 ===================== */
function matchGame(){
  const L=shuffle(IDIOMS), R=shuffle(IDIOMS);
  const st={sel:null, done:new Set(), miss:0, t0:Date.now()};
  $app.innerHTML=`<div class="bar"><button class="back" onclick="goMenu()">← 回選單</button><h2>🔗 配對連連看</h2><span class="sp"></span>
    <span class="pill" id="mt">⏱ 0 秒</span><span class="pill" id="mm">失誤 0 次</span></div>
    <div class="intro" style="font-size:16px">先點左邊的成語，再點右邊相符的解釋（也可以先點右邊）。</div>
    <div class="match"><div class="col">${L.map(x=>`<button class="mc L" data-w="${x.w}" data-s="L">${x.w}</button>`).join("")}</div>
    <div class="col">${R.map(x=>`<button class="mc R" data-w="${x.w}" data-s="R">${x.m}</button>`).join("")}</div></div><div id="fb"></div>`;
  const timer=setInterval(()=>{ const el=document.getElementById("mt"); if(!el) return clearInterval(timer); el.textContent=`⏱ ${Math.floor((Date.now()-st.t0)/1000)} 秒`; },500);
  $app.querySelectorAll(".mc").forEach(b=>b.onclick=()=>{
    if(b.classList.contains("done")) return;
    if(!st.sel || st.sel.dataset.s===b.dataset.s){ $app.querySelectorAll(".mc.sel").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); st.sel=b; return; }
    const a=st.sel; st.sel=null; a.classList.remove("sel");
    if(a.dataset.w===b.dataset.w){
      a.classList.add("done"); b.classList.add("done"); st.done.add(a.dataset.w); beep(true);
      if(st.done.size===IDIOMS.length){
        clearInterval(timer);
        const sec=Math.floor((Date.now()-st.t0)/1000);
        const stars=st.miss===0?3:st.miss<=2?2:st.miss<=4?1:0;
        saveBest("match",stars); if(stars>=2) confetti();
        G={mode:"match"};
        document.getElementById("fb").innerHTML=`<div class="qcard result" style="margin-top:18px"><div class="stars">${starStr(stars)}</div>
          <h2>全部配對完成！</h2><p>花了 ${sec} 秒，失誤 ${st.miss} 次</p>
          <div class="rbtns"><button class="a" onclick="matchGame()">🔁 再玩一次</button><button class="b" onclick="goMenu()">🏠 回選單</button></div></div>`;
        document.getElementById("fb").scrollIntoView({behavior:"smooth"});
      }
    } else {
      st.miss++; beep(false); document.getElementById("mm").textContent=`失誤 ${st.miss} 次`;
      [a,b].forEach(x=>{x.classList.remove("wrong"); void x.offsetWidth; x.classList.add("wrong");});
    }
  });
}

goMenu();
</script>
